# Secret for AI Agent API keys
# IMPORTANT: Replace placeholder values before applying.
# In production, use sealed-secrets, external-secrets, or vault-operator.
apiVersion: v1
kind: Secret
metadata:
  name: aion-api-keys
  namespace: aion-system
  labels:
    app.kubernetes.io/name: aion-agent
    app.kubernetes.io/part-of: aion
type: Opaque
stringData:
  # Replace with actual API keys
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
  # OPENAI_API_KEY: "sk-REPLACE_ME"
  # GOOGLE_API_KEY: "REPLACE_ME"
