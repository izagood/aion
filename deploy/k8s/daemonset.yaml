apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aion-agent
  namespace: aion-system
  labels:
    app.kubernetes.io/name: aion-agent
    app.kubernetes.io/part-of: aion
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aion-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aion-agent
        app.kubernetes.io/part-of: aion
    spec:
      serviceAccountName: aion-agent
      hostPID: true  # Required for eBPF process visibility
      terminationGracePeriodSeconds: 30
      containers:
        - name: aion-agent
          image: aion/agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: rest
              containerPort: 8080
              protocol: TCP
          env:
            - name: AION_CONFIG
              value: /etc/aion/default.toml
            - name: AION_AGENTS_CONFIG
              value: /etc/aion/agents.toml
            - name: AION_AUDIT_DIR
              value: /var/lib/aion/audit
            - name: RUST_LOG
              value: info
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_UID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: aion-api-keys
          volumeMounts:
            - name: config
              mountPath: /etc/aion
              readOnly: true
            - name: audit
              mountPath: /var/lib/aion/audit
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF           # eBPF program loading
                - SYS_ADMIN     # eBPF map access
                - PERFMON       # perf events for eBPF
                - SYS_RESOURCE  # rlimit for eBPF maps
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: rest
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: aion-config
        - name: audit
          hostPath:
            path: /var/lib/aion/audit
            type: DirectoryOrCreate
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
