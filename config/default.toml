# AION Default Configuration
# Override with config/production.toml or environment variables

[daemon]
listen_addr = "0.0.0.0"
grpc_port = 50051
rest_port = 8080
log_level = "info"
audit_dir = "/var/lib/aion/audit"

[observe]
enable_ebpf = true
enable_cgroup = true
enable_kube_watcher = true
poll_interval_secs = 10

[pipeline]
max_concurrent_mounts = 3
canary_duration_secs = 30
